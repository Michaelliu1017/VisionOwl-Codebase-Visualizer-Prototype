services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visionowl}
      POSTGRES_USER: ${POSTGRES_USER:-visionowl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - visionowl-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 4s
      retries: 20
    networks: [visionowl-private]

  cloud:
    build:
      context: ..
      dockerfile: cloud-backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 17800
      VISIONOWL_CLOUD_STORE: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-visionowl}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-visionowl}
      VISIONOWL_ALLOWED_ORIGINS: ${VISIONOWL_ALLOWED_ORIGINS:-http://127.0.0.1:17300,http://localhost:17300,http://127.0.0.1:4173,http://localhost:4173}
      VISIONOWL_ACCESS_TOKEN_TTL_SECONDS: ${VISIONOWL_ACCESS_TOKEN_TTL_SECONDS:-3600}
      VISIONOWL_REFRESH_TOKEN_TTL_SECONDS: ${VISIONOWL_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      VISIONOWL_INVITE_TTL_SECONDS: ${VISIONOWL_INVITE_TTL_SECONDS:-604800}
      VISIONOWL_GRAPH_MAX_BYTES: ${VISIONOWL_GRAPH_MAX_BYTES:-5000000}
    command: ["sh", "-c", "node cloud-backend/src/db/migrate.js && exec node cloud-backend/src/server.js"]
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["17800"]
    networks: [visionowl-private]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      cloud:
        condition: service_healthy
    ports:
      - "${VISIONOWL_GATEWAY_BIND:-127.0.0.1:8080}:80"
    volumes:
      - ./nginx/visionowl-cloud.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [visionowl-private]

volumes:
  visionowl-postgres:

networks:
  visionowl-private:
    driver: bridge
