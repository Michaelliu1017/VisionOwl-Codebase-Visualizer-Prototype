[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "visionowl-skill-lab"
version = "0.1.0"
description = "Deterministic evaluation and optimization control plane for VisionOwl skills"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "redis>=5,<7",
]

[project.optional-dependencies]
api = ["fastapi", "uvicorn"]
development = ["pytest"]
evaluation = [
    "deepeval>=4,<5",
    "openai>=1,<3",
    "skillopt @ git+https://github.com/microsoft/SkillOpt.git@47fe269d75d3def79ffd90236261d26d84868ae5",
]

[project.scripts]
visionowl-skill-lab = "skill_lab.cli:main"
visionowl-skill-lab-worker = "skill_lab.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
